<main class="page-main container">

</main>

<script>
const revealObserver = new IntersectionObserver((entries, observer) => {
  entries.forEach(entry => {
    if (entry.isIntersecting) {
      entry.target.classList.add('visible');
      observer.unobserve(entry.target);
    }
  });
}, { threshold: 0.15, rootMargin: '0px 0px -50px 0px' });

document.querySelectorAll('.reveal, .gallery-card').forEach(el => revealObserver.observe(el));

const copy = document.querySelector('#scroll-copy');
const words = document.querySelectorAll('.reveal-word');
function updateTextReveal() {
  if (!copy || !words.length) return;
  const rect = copy.getBoundingClientRect();
  const start = innerHeight * .78;
  const end = innerHeight * .35;
  const progress = Math.max(0, Math.min(1, (start - rect.top) / (start - end)));
  words.forEach((word, index) => {
    const amount = progress * words.length - index;
    word.classList.toggle('active', amount >= .7);
  });
}
addEventListener('scroll', updateTextReveal, { passive: true });
addEventListener('resize', updateTextReveal);
updateTextReveal();
</script>
</body></html>
